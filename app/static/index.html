<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>企业知识库智能助手</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div>
            <h1>企业知识库</h1>
            <p>RAG 工作台</p>
          </div>
        </div>

        <section class="panel">
          <h2>文档入库</h2>
          <form id="uploadForm">
            <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.md,.markdown,.txt" />
            <button type="submit">上传并向量化</button>
          </form>
          <div id="uploadStatus" class="muted"></div>
          <div id="documentList" class="list"></div>
        </section>

        <section class="panel">
          <h2>后台配置</h2>
          <label>Chunk Size <input id="chunkSize" type="number" min="100" max="3000" /></label>
          <label>Overlap <input id="chunkOverlap" type="number" min="0" max="800" /></label>
          <label>Top K <input id="topK" type="number" min="1" max="20" /></label>
          <label>Min Score <input id="minScore" type="number" min="0" max="1" step="0.01" /></label>
          <label>Chat Model <input id="chatModel" type="text" /></label>
          <label>Embedding Provider <input id="embeddingProvider" type="text" /></label>
          <label>Embedding Model <input id="embeddingModel" type="text" /></label>
          <label>Embedding Dimensions <input id="embeddingDimensions" type="number" min="64" max="4096" /></label>
          <label class="check"><input id="rerank" type="checkbox" /> 启用 rerank</label>
          <button id="saveConfig">保存配置</button>
        </section>

        <section class="panel">
          <h2>质量评估</h2>
          <button id="runEval">运行测试集</button>
          <div id="evalResult" class="muted"></div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2>知识检索问答</h2>
            <p>基于已入库片段回答，保留引用、耗时和反馈记录。</p>
          </div>
          <button id="newConversation">新会话</button>
        </header>

        <section class="ask">
          <textarea id="question" rows="4" placeholder="输入企业知识库问题，例如：报销审批需要哪些材料？"></textarea>
          <div class="ask-actions">
            <button id="askButton">检索并回答</button>
            <span id="latency" class="muted"></span>
          </div>
        </section>

        <section class="answer-area">
          <div class="answer-header">
            <h3>回答</h3>
            <div id="feedbackButtons" class="feedback hidden">
              <button data-rating="up">有帮助</button>
              <button data-rating="down">需改进</button>
            </div>
          </div>
          <pre id="answer">请先上传文档，然后开始提问。</pre>
        </section>

        <section class="sources-area">
          <h3>引用来源片段</h3>
          <div id="sources" class="sources"></div>
        </section>

        <section class="logs-area">
          <h3>最近问答记录</h3>
          <div id="logs" class="logs"></div>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
